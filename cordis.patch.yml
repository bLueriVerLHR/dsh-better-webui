# @blueriverlhr/dsh-better-webui — aggregated bundle patch (GENERATED).
# Source of truth: each package's cordis.patch.js. Run `npm run build` to
# regenerate. Install THIS bundle, or individual feature bundles — never both
# (a duplicate row id would mount the same plugin twice).
- insert:
    - id: better-webui-archive
      name: "@blueriverlhr/dsh-better-webui-archive"
- insert:
    - id: better-webui-reasoning
      name: "@blueriverlhr/dsh-better-webui-reasoning"
- insert:
    - id: better-webui-chime
      name: "@blueriverlhr/dsh-better-webui-chime"
- insert:
    - id: better-webui-search
      name: "@blueriverlhr/dsh-better-webui-search"
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: exa
- insert:
    - id: better-webui-bashguard
      name: "@blueriverlhr/dsh-better-webui-bashguard"
- insert:
    - id: better-webui-settings
      name: "@blueriverlhr/dsh-better-webui-settings"
